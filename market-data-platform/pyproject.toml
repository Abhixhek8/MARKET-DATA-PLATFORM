[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-platform"
version = "0.1.0"
description = "End-to-end market data platform: ingestion, warehouse, API, dashboard, ML"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy", "scikit-learn", "pyarrow"]

[project.optional-dependencies]
ingest = ["yfinance"]
api = ["fastapi", "uvicorn[standard]"]
dashboard = ["streamlit", "plotly"]
ml = ["mlflow"]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
mdp = "mdp.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]


[tool.vercel]
entrypoint = "src.mdp.api.main:app"